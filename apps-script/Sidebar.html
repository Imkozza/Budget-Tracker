<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #202124;
      margin: 0;
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 4px;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 50px;
    }
    .hint {
      font-size: 11px;
      color: #5f6368;
      margin-top: 2px;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 9px;
      background: #1c4587;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #9aa0a6;
      cursor: default;
    }
    #status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    #status.ok {
      background: #e6f4ea;
      color: #137333;
      display: block;
    }
    #status.err {
      background: #fce8e6;
      color: #c5221f;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Add Transaction</h2>
  <form id="txnForm">
    <label for="date">Date</label>
    <input type="date" id="date" required>

    <label for="amount">Amount (AUD)</label>
    <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>

    <label for="direction">Direction</label>
    <select id="direction" required></select>

    <label for="category">Category</label>
    <select id="category">
      <option value="">(leave blank -> Uncategorised)</option>
    </select>

    <label for="scope">Scope</label>
    <select id="scope" required></select>

    <label for="note">Note</label>
    <textarea id="note" placeholder="Optional"></textarea>

    <label for="receiptFile">Receipt Image</label>
    <input type="file" id="receiptFile" accept="image/*,application/pdf">
    <div class="hint">Uploaded to the Drive receipts folder; the link is filled in for you.</div>

    <label for="receiptLink">Receipt Link (alternative)</label>
    <input type="url" id="receiptLink" placeholder="Or paste a link instead of uploading">
    <div class="hint" id="receiptHint">If you attach a file above, it's used instead of this link.</div>

    <button type="submit" id="submitBtn">Add Transaction</button>
  </form>
  <div id="status"></div>

  <script>
    function setStatus(kind, text) {
      var el = document.getElementById('status');
      el.className = kind;
      el.textContent = text;
    }

    function populateSelect(id, values, placeholder) {
      var select = document.getElementById(id);
      if (placeholder) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = placeholder;
        opt.disabled = true;
        opt.selected = true;
        select.appendChild(opt);
      }
      values.forEach(function (v) {
        var opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    }

    google.script.run
      .withSuccessHandler(function (options) {
        populateSelect('direction', options.directions, 'Select...');
        populateSelect('scope', options.scopes, 'Select...');
        options.categories.forEach(function (c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          document.getElementById('category').appendChild(opt);
        });
        document.getElementById('date').value = options.today;
      })
      .withFailureHandler(function (err) {
        setStatus('err', 'Could not load form options: ' + err.message);
      })
      .getTransactionFormOptions();

    var MAX_RECEIPT_BYTES = 10 * 1024 * 1024;

    function readFileAsBase64(file) {
      return new Promise(function (resolve, reject) {
        if (file.size > MAX_RECEIPT_BYTES) {
          reject(new Error('Receipt file is too large (max 10 MB).'));
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          var dataUrl = reader.result;
          var base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
          resolve({ name: file.name, mimeType: file.type, base64: base64 });
        };
        reader.onerror = function () { reject(new Error('Could not read the file.')); };
        reader.readAsDataURL(file);
      });
    }

    function submitTransaction(form, fileData) {
      google.script.run
        .withSuccessHandler(function (result) {
          setStatus('ok', result.message);
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('amount').value = '';
          document.getElementById('note').value = '';
          document.getElementById('receiptLink').value = '';
          document.getElementById('receiptFile').value = '';
          document.getElementById('category').selectedIndex = 0;
        })
        .withFailureHandler(function (err) {
          setStatus('err', err.message);
          document.getElementById('submitBtn').disabled = false;
        })
        .addTransaction(form, fileData);
    }

    document.getElementById('txnForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      setStatus('', '');

      var form = {
        date: document.getElementById('date').value,
        amount: document.getElementById('amount').value,
        direction: document.getElementById('direction').value,
        category: document.getElementById('category').value,
        scope: document.getElementById('scope').value,
        note: document.getElementById('note').value,
        receiptLink: document.getElementById('receiptLink').value
      };

      var fileInput = document.getElementById('receiptFile');
      var file = fileInput.files && fileInput.files[0];

      if (file) {
        setStatus('ok', 'Uploading receipt...');
        readFileAsBase64(file).then(function (fileData) {
          submitTransaction(form, fileData);
        }).catch(function (err) {
          setStatus('err', err.message);
          btn.disabled = false;
        });
      } else {
        submitTransaction(form, null);
      }
    });
  </script>
</body>
</html>
